name = "dus-aane-bot-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[vars]
# APPS_SCRIPT_URL is set via `wrangler secret put APPS_SCRIPT_URL`
# Do NOT put it here — use secrets for the actual URL

[[d1_databases]]
binding = "DB"
database_name = "dus-aane-bot"
database_id = "e7b12ae1-a783-4a2f-875e-a6128ffc226f"
migrations_dir = "migrations"

# Slow updates (/ask, SMS paste, Apps Script calls) run in the queue
# consumer: one at a time, no batching delay, never retried (could double-post).
[[queues.producers]]
binding = "UPDATES"
queue = "dus-aane-bot-updates"

[[queues.consumers]]
queue = "dus-aane-bot-updates"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 0

# 08:00 IST daily; src/app/cron.js picks the jobs by IST weekday.
[triggers]
crons = ["30 2 * * *"]
