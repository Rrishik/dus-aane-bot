name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      # Apps Script only needs the Worker's URL and the shared bridge secret.
      - name: Create AConfig.js from secrets
        run: |
          printf "const WORKER_PROXY_URL = \"${{ secrets.WORKER_PROXY_URL }}\";\n" > AConfig.js
          printf "const INTERNAL_SECRET = \"${{ secrets.INTERNAL_SECRET }}\";\n" >> AConfig.js

      - name: Set up authentication
        env:
          CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
        run: |
          printf '%s' "$CLASP_TOKEN" > ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push --force

      - name: Deploy new version
        run: clasp deploy --deploymentId ${{ secrets.DEPLOYMENT_ID }} -d "Auto deploy"

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.81.1"
          workingDirectory: worker
          command: d1 migrations apply dus-aane-bot --remote

      - name: Ensure the updates queue exists
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if npx --yes wrangler@4.81.1 queues list 2>&1 | grep -qE "dus-aane-bot-updates([^-]|$)"; then
            echo "Queue exists."
          else
            npx --yes wrangler@4.81.1 queues create dus-aane-bot-updates
          fi

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.81.1"
          workingDirectory: worker
          secrets: |
            APPS_SCRIPT_URL
            WEBHOOK_SECRET
            INTERNAL_SECRET
            BOT_TOKEN
            ADMIN_CHAT_ID
            AZURE_OPENAI_ENDPOINT
            AZURE_OPENAI_API_KEY
            AZURE_OPENAI_DEPLOYMENT_NAME
            AZURE_OPENAI_API_VERSION
        env:
          APPS_SCRIPT_URL: ${{ secrets.SCRIPT_APP_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}

      # Re-applied on every deploy, so rotating BOT_TOKEN or WEBHOOK_SECRET
      # only needs the secret updated and a deploy.
      - name: Point the bot's webhook at the Worker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: node worker/scripts/set-webhook.mjs "${{ secrets.WORKER_PROXY_URL }}"

      - name: Smoke test
        env:
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: node worker/scripts/smoke.mjs "${{ secrets.WORKER_PROXY_URL }}"
