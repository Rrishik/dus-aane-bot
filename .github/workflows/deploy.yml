name: Deploy to Apps Script

on:
  push:
    branches:
      - main
  # Re-deploy after changing the NATIVE_MODE variable (cutover / rollback).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Check generated Worker parser is in sync
        run: npm run parser:check

      - name: Create AConfig.js from secrets
        run: |
          printf "// Telegram\n" > AConfig.js
          printf "const BOT_TOKEN = \"${{ secrets.BOT_TOKEN }}\";\n" >> AConfig.js
          printf "const ADMIN_CHAT_ID = \"${{ secrets.GROUP_CHAT_ID }}\";\n\n" >> AConfig.js
          printf "const SCRIPT_APP_URL = \"${{ secrets.SCRIPT_APP_URL }}\";\n\n" >> AConfig.js
          printf "const WORKER_PROXY_URL = \"${{ secrets.WORKER_PROXY_URL }}\";\n\n" >> AConfig.js
          printf "// Google Sheets\n" >> AConfig.js
          printf "const ADMIN_SHEET_ID = \"${{ secrets.PROD_SHEET_ID }}\";\n" >> AConfig.js
          printf "const TEMPLATE_SHEET_ID = \"${{ secrets.TEMPLATE_SHEET_ID }}\";\n\n" >> AConfig.js
          printf "const GROUP_TEMPLATE_SHEET_ID = \"${{ secrets.GROUP_TEMPLATE_SHEET_ID }}\";\n\n" >> AConfig.js
          printf "// Azure OpenAI\n" >> AConfig.js
          printf "const AZURE_OPENAI_ENDPOINT = \"${{ secrets.AZURE_OPENAI_ENDPOINT }}\";\n" >> AConfig.js
          printf "const AZURE_OPENAI_API_KEY = \"${{ secrets.AZURE_OPENAI_API_KEY }}\";\n" >> AConfig.js
          printf "const AZURE_OPENAI_DEPLOYMENT_NAME = \"${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}\";\n" >> AConfig.js
          printf "const AZURE_OPENAI_API_VERSION = \"${{ secrets.AZURE_OPENAI_API_VERSION }}\";\n\n" >> AConfig.js
          printf "// Webhook auth (Telegram -> Worker -> Apps Script)\n" >> AConfig.js
          printf "const WEBHOOK_SECRET = \"${{ secrets.WEBHOOK_SECRET }}\";\n\n" >> AConfig.js
          printf "// D1 mode (Worker <-> Apps Script bridge)\n" >> AConfig.js
          printf "const INTERNAL_SECRET = \"${{ secrets.INTERNAL_SECRET }}\";\n" >> AConfig.js
          printf "const NATIVE_MODE = \"${{ vars.NATIVE_MODE }}\";\n" >> AConfig.js

      - name: Set up authentication
        env:
          CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
        run: |
          printf '%s' "$CLASP_TOKEN" > ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push --force

      - name: Deploy new version
        run: clasp deploy --deploymentId ${{ secrets.DEPLOYMENT_ID }} -d "Auto deploy"

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.81.1"
          workingDirectory: worker
          command: d1 migrations apply dus-aane-bot --remote

      - name: Ensure the updates queue exists
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if npx --yes wrangler@4.81.1 queues list 2>&1 | grep -qE "dus-aane-bot-updates([^-]|$)"; then
            echo "Queue exists."
          else
            npx --yes wrangler@4.81.1 queues create dus-aane-bot-updates
          fi

      # Repository variable NATIVE_MODE=1 switches both sides to D1 mode.
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.81.1"
          workingDirectory: worker
          secrets: |
            APPS_SCRIPT_URL
            WEBHOOK_SECRET
            INTERNAL_SECRET
            BOT_TOKEN
            ADMIN_CHAT_ID
            AZURE_OPENAI_ENDPOINT
            AZURE_OPENAI_API_KEY
            AZURE_OPENAI_DEPLOYMENT_NAME
            AZURE_OPENAI_API_VERSION
          vars: |
            MODE
        env:
          APPS_SCRIPT_URL: ${{ secrets.SCRIPT_APP_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          MODE: ${{ vars.NATIVE_MODE == '1' && 'native' || 'proxy' }}

      - name: Smoke test the native Worker
        if: vars.NATIVE_MODE == '1'
        env:
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: node worker/scripts/smoke.mjs "${{ secrets.WORKER_PROXY_URL }}"
